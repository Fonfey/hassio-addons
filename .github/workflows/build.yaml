name: Build images

on:
  push:
    paths:
      - "*/config.yaml"
      - "*/Dockerfile"
      - "*/build.yaml"
      - "*/*.py"
      - "*/*.js"
      - "*/*.json"
      - "*/fonts/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to build (space separated folder names, empty = all)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Find changed apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.find.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: find
        name: Find changed apps
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_APPS: ${{ github.event.inputs.apps }}
        run: |
          all=$(ls -d */ | tr -d / | while read d; do [ -f "$d/config.yaml" ] && [ -f "$d/Dockerfile" ] && echo "$d"; done)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            apps="${INPUT_APPS:-$all}"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            apps="$all"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -q '^.github/workflows/build.yaml$'; then
            apps="$all"
          else
            apps=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | cut -d/ -f1 | sort -u | while read d; do echo "$all" | grep -qx "$d" && echo "$d"; done)
          fi
          json=$(printf '%s\n' $apps | grep -v '^$' | jq -R . | jq -cs .)
          echo "Apps: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.app }} (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changes.outputs.apps) }}
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - name: Read image name
        id: image
        run: |
          img=$(grep '^image:' "${{ matrix.app }}/config.yaml" | awk '{print $2}' | sed 's|^ghcr.io/fonfey/||')
          echo "name=$img" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/${{ matrix.app }} \
            --image "${{ steps.image.outputs.name }}" \
            --docker-hub ghcr.io/fonfey \
            --addon
