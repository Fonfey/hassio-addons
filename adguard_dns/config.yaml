name: AdGuard Dashboard
version: "1.7.0"
slug: adguard_dns_dashboard
description: "Statistics, query log and blocking for AdGuard DNS (cloud service) or your own AdGuard Home. Choose which one on the Configuration tab."
url: https://github.com/Fonfey/hassio-addons/tree/main/adguard_dns
image: ghcr.io/fonfey/{arch}-hassio-adguard-dns-dashboard
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:advertisements-off
panel_title: AdGuard
options:
  source: cloud
  api_key: ""
  home_url: ""
  home_username: ""
  home_password: ""
  refresh_seconds: 60
  home_country: "NL"
  allow_blocking: true
  allowed_users: []
schema:
  source: list(cloud|home)
  api_key: password?
  home_url: str?
  home_username: str?
  home_password: password?
  refresh_seconds: int(15,3600)
  home_country: str
  allow_blocking: bool
  allowed_users:
    - str
