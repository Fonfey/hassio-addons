name: AdGuard DNS Dashboard
version: "1.5.1"
slug: adguard_dns_dashboard
description: "Statistics of your AdGuard DNS account. Create an API key at adguard-dns.io, User preferences, API keys."
url: https://github.com/Fonfey/hassio-addons/tree/main/adguard_dns
image: ghcr.io/fonfey/{arch}-hassio-adguard-dns-dashboard
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:shield-check
panel_title: AdGuard DNS
options:
  api_key: ""
  refresh_seconds: 60
  home_country: "NL"
  allow_blocking: true
  allowed_users: []
schema:
  api_key: password
  refresh_seconds: int(15,3600)
  home_country: str
  allow_blocking: bool
  allowed_users:
    - str
