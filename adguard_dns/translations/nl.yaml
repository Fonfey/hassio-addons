configuration:
  source:
    name: Bron
    description: "cloud: AdGuard DNS, de clouddienst op adguard-dns.io (vraagt een API-key). home: je eigen AdGuard Home (vraagt het adres, de gebruikersnaam en het wachtwoord)."
  api_key:
    name: API-key
    description: 'Alleen voor cloud. Aanmaken op https://adguard-dns.io/en/dashboard/ : klik rechtsboven op je account, kies User preferences
      en ga naar API keys. Kopieer de key direct, je ziet hem maar één keer.'
  home_url:
    name: Adres van AdGuard Home
    description: "Alleen voor home. Het adres van de webinterface van AdGuard Home, bijvoorbeeld http://192.168.1.2:3000. Gebruik je de AdGuard Home-app in Home Assistant? Vul dan bij die app op het tabblad Configuratie, onder Netwerk, een poort in bij Web interface, en vul hier http://<IP-adres van Home Assistant>:<die poort> in."
  home_username:
    name: Gebruikersnaam AdGuard Home
    description: Alleen voor home. De gebruikersnaam waarmee je inlogt bij AdGuard Home.
  home_password:
    name: Wachtwoord AdGuard Home
    description: Alleen voor home. Het wachtwoord waarmee je inlogt bij AdGuard Home.
  refresh_seconds:
    name: Verversen (seconden)
    description: Hoe vaak het dashboard nieuwe gegevens ophaalt.
  home_country:
    name: Thuisland
    description: Landcode voor de speld op de wereldkaart, bijvoorbeeld NL.
  allow_blocking:
    name: Wijzigingen toestaan
    description: 'Laat het dashboard instellingen wijzigen: domeinen blokkeren en deblokkeren, gebruikersregels, blokkeerlijsten,
      serverinstellingen en bescherming per apparaat. Zet uit voor een dashboard dat alleen mag kijken.'
  allowed_users:
    name: Toegestane beheerders (optioneel)
    description: Alleen beheerders zien de knop in de zijbalk. Heb je meerdere beheerders en mag niet iedereen het dashboard
      zien, vul dan hier de gebruikersnamen in die wel mogen. Laat leeg om alle beheerders toegang te geven. Onderaan het
      dashboard staat "Ingelogd als" met de exacte naam.
