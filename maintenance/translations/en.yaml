configuration:
  check_interval_minutes:
    name: Check every (minutes)
    description: How often Maintenance checks your Home Assistant. Use Check again in the app to check right away.
  battery_threshold:
    name: Battery low below (%)
    description: Batteries below this percentage are listed. Phones and home batteries are not counted.
  disabled_days:
    name: Automation long off after (days)
    description: Disabled automations that have not run for longer than this are listed for clean-up.
  stale_days:
    name: Sensor without data after (days)
    description: Sensors that have not reported a new or changing value for this long are listed.
  allowed_users:
    name: Allowed admins (optional)
    description: Only administrators see the sidebar button. Enter usernames if not every administrator may see Maintenance. Empty means all administrators.
