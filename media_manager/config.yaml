name: Media manager
version: "1.1.0"
slug: mediabeheer
description: "See the photos, videos and audio in your media folder with thumbnails, and upload, rename, move or delete them."
url: https://github.com/Fonfey/hassio-addons/tree/main/media_manager
image: ghcr.io/fonfey/{arch}-hassio-media-manager
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:image-multiple
panel_title: Media manager
homeassistant_api: true
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
backup_exclude:
  - "thumbs/*"
  - "trash/*"
options:
  folder: /media
  trash_days: 30
  allowed_users: []
schema:
  folder: str
  trash_days: int(0,365)
  allowed_users:
    - str
