name: Notifications
version: "1.1.3"
slug: meldingen
description: "See which notifications Home Assistant sends: when, to whom, by which automation, and whether a button was pressed or it failed."
url: https://github.com/Fonfey/hassio-addons/tree/main/notifications
image: ghcr.io/fonfey/{arch}-hassio-notifications
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:bell
panel_title: Notifications
homeassistant_api: true
options:
  keep_days: 30
  allowed_users: []
schema:
  keep_days: int(1,365)
  allowed_users:
    - str
