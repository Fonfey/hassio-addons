name: Maintenance
version: "1.4.1"
slug: onderhoud
description: "One overview of what needs attention in your Home Assistant, in order of importance."
url: https://github.com/Fonfey/hassio-addons/tree/main/onderhoud
image: ghcr.io/fonfey/{arch}-hassio-maintenance
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:wrench-check
panel_title: Maintenance
homeassistant_api: true
hassio_api: true
hassio_role: manager
options:
  check_interval_minutes: 60
  battery_threshold: 20
  disabled_days: 30
  stale_days: 7
  allowed_users: []
schema:
  check_interval_minutes: int(10,1440)
  battery_threshold: int(5,80)
  disabled_days: int(7,365)
  stale_days: int(2,90)
  allowed_users:
    - str
