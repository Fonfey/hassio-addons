name: Onderhoud
version: "1.3.0"
slug: onderhoud
description: Eén overzicht van wat aandacht nodig heeft in je Home Assistant, op volgorde van belang.
url: https://github.com/Fonfey/hassio-addons
image: ghcr.io/fonfey/{arch}-ha-onderhoud
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:wrench-check
panel_title: Onderhoud
homeassistant_api: true
hassio_api: true
hassio_role: manager
options:
  check_interval_minutes: 60
  battery_threshold: 20
  disabled_days: 30
  stale_days: 7
  allowed_users: []
schema:
  check_interval_minutes: int(10,1440)
  battery_threshold: int(5,80)
  disabled_days: int(7,365)
  stale_days: int(2,90)
  allowed_users:
    - str
