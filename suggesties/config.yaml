name: Suggesties
version: "1.0.4"
slug: suggesties
description: "Stelt kant-en-klare automations voor op basis van je eigen apparaten en gewoontes. Jij kiest wat er gemaakt wordt; alles blijft lokaal."
url: https://github.com/Fonfey/hassio-addons
image: ghcr.io/fonfey/{arch}-ha-suggesties
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:lightbulb-auto-outline
panel_title: Suggesties
homeassistant_api: true
options:
  history_days: 10
  allowed_users: []
schema:
  history_days: int(3,30)
  allowed_users:
    - str
