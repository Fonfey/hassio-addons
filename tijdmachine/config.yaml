name: Time Machine
version: "1.1.0"
slug: tijdmachine
description: "Keeps earlier versions of your automations, scripts, scenes, dashboards and helpers, so you can restore one."
url: https://github.com/Fonfey/hassio-addons
image: ghcr.io/fonfey/{arch}-ha-tijdmachine
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:history
panel_title: Time Machine
homeassistant_api: true
options:
  keep_days: 30
  keep_min_versions: 5
  scan_minutes: 5
  allowed_users: []
schema:
  keep_days: int(1,3650)
  keep_min_versions: int(1,100)
  scan_minutes: int(1,120)
  allowed_users:
    - str
