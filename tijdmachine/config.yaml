name: Tijdmachine
version: "1.0.7"
slug: tijdmachine
description: Bewaart eerdere versies van je automations, scripts, scènes, dashboards en helpers, zodat je er één kunt terugzetten.
url: https://github.com/Fonfey/hassio-addons
image: ghcr.io/fonfey/{arch}-ha-tijdmachine
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:history
panel_title: Tijdmachine
homeassistant_api: true
options:
  keep_days: 30
  keep_min_versions: 5
  scan_minutes: 5
  allowed_users: []
schema:
  keep_days: int(1,3650)
  keep_min_versions: int(1,100)
  scan_minutes: int(1,120)
  allowed_users:
    - str
