name: UniFi Dashboard
version: "1.6.0"
slug: unifi_dashboard
description: Live overzicht van je UniFi-netwerk. API-key aanmaken in UniFi Network via Instellingen, Control Plane, Integraties.
url: https://github.com/Fonfey/hassio-addons
image: ghcr.io/fonfey/{arch}-unifi-dashboard
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:router-network
panel_title: UniFi
options:
  unifi_host: "192.168.1.1"
  unifi_api_key: ""
  unifi_site: ""
  refresh_seconds: 10
  allowed_users: []
schema:
  unifi_host: str
  unifi_api_key: password
  unifi_site: str?
  refresh_seconds: int(5,300)
  allowed_users:
    - str
